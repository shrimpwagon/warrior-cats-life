<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <ellipse cx="60" cy="108" rx="38" ry="6" fill="rgba(0,0,0,0.25)"/>
  <!-- body -->
  <ellipse cx="60" cy="80" rx="32" ry="22" fill="#b39368"/>
  <!-- legs hint -->
  <ellipse cx="46" cy="100" rx="6" ry="5" fill="#9c7d56"/>
  <ellipse cx="74" cy="100" rx="6" ry="5" fill="#9c7d56"/>
  <!-- tail curling up -->
  <path d="M88 78 Q104 60 96 42 Q92 38 88 44 Q94 56 84 70 Z" fill="#b39368"/>
  <!-- chest -->
  <ellipse cx="60" cy="80" rx="14" ry="10" fill="#e8d2a0"/>
  <!-- head -->
  <ellipse cx="60" cy="48" rx="24" ry="22" fill="#b39368"/>
  <!-- ears -->
  <polygon points="42,32 38,14 52,28" fill="#b39368"/>
  <polygon points="78,32 82,14 68,28" fill="#b39368"/>
  <polygon points="44,30 42,20 50,28" fill="#7d5d3a"/>
  <polygon points="76,30 78,20 70,28" fill="#7d5d3a"/>
  <!-- face stripes -->
  <path d="M40 42 Q44 40 48 42" stroke="#7d5d3a" stroke-width="1.5" fill="none"/>
  <path d="M72 42 Q76 40 80 42" stroke="#7d5d3a" stroke-width="1.5" fill="none"/>
  <!-- eyes (open, friendly) -->
  <ellipse cx="51" cy="48" rx="3.5" ry="4.5" fill="#fff"/>
  <ellipse cx="69" cy="48" rx="3.5" ry="4.5" fill="#fff"/>
  <ellipse cx="51" cy="49" rx="2.4" ry="3.5" fill="#3a8a3a"/>
  <ellipse cx="69" cy="49" rx="2.4" ry="3.5" fill="#3a8a3a"/>
  <ellipse cx="51.5" cy="48" rx="0.9" ry="2.5" fill="#0a1a06"/>
  <ellipse cx="69.5" cy="48" rx="0.9" ry="2.5" fill="#0a1a06"/>
  <!-- shine -->
  <circle cx="52" cy="46.5" r="0.7" fill="#fff"/>
  <circle cx="70" cy="46.5" r="0.7" fill="#fff"/>
  <!-- nose -->
  <path d="M58 56 L62 56 L60 59 Z" fill="#3a2519"/>
  <!-- mouth (open, talking) -->
  <path d="M60 59 Q56 63 53 62" stroke="#3a2519" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M60 59 Q64 63 67 62" stroke="#3a2519" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <ellipse cx="60" cy="64" rx="3.5" ry="2" fill="#7a3a3a"/>
  <!-- whiskers -->
  <line x1="40" y1="55" x2="28" y2="53" stroke="#5d432a" stroke-width="1"/>
  <line x1="40" y1="58" x2="28" y2="60" stroke="#5d432a" stroke-width="1"/>
  <line x1="80" y1="55" x2="92" y2="53" stroke="#5d432a" stroke-width="1"/>
  <line x1="80" y1="58" x2="92" y2="60" stroke="#5d432a" stroke-width="1"/>
</svg>
